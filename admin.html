<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>后台管理 · 资源站</title>
<style>
:root{
  --bg:#f4f5f2;--paper:#fff;--ink:#1c1f1c;--ink2:#4d5450;--ink3:#8b918c;
  --line:#dcdfd9;--line2:#eaede7;--accent:#a8542c;--ok:#3f7a5a;--err:#b33f3f;
  --font:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);font-size:14px;line-height:1.7;color:var(--ink);background:var(--bg);padding:0 0 90px}
a{color:inherit;text-decoration:none}
.wrap{max-width:920px;margin:0 auto;padding:0 clamp(14px,3vw,28px)}
header{border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:0;z-index:10}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;height:56px;flex-wrap:wrap}
.brand{font-weight:600;font-size:16px}
.brand b{color:var(--accent);font-weight:600}
.hint{font-size:12px;color:var(--ink3)}
main{padding-top:22px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:5px;padding:clamp(14px,2.4vw,22px)}
.card h2{font-size:13px;font-weight:600;color:var(--ink2);letter-spacing:.04em;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--line2)}
.row{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.row:last-child{margin-bottom:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid2 .row{margin-bottom:0}
label{font-size:12.5px;color:var(--ink2);font-weight:500}
label .req{color:var(--err);margin-left:2px}
label .opt{color:var(--ink3);font-weight:400;font-size:11.5px;margin-left:4px}
input[type=text],input[type=url],input[type=number],textarea{
  width:100%;font-family:inherit;font-size:13.5px;color:var(--ink);
  background:#fbfcfb;border:1px solid var(--line);border-radius:3px;
  padding:8px 10px;transition:border-color .15s,background .15s;
}
input:focus,textarea:focus{outline:none;border-color:var(--accent);background:#fff}
textarea{font-family:var(--mono);font-size:12.5px;line-height:1.6;resize:vertical;min-height:64px}
small{font-size:11.5px;color:var(--ink3)}
.actions{position:fixed;left:0;right:0;bottom:0;background:rgba(251,251,249,.97);backdrop-filter:blur(6px);border-top:1px solid var(--line);z-index:20}
.actions .wrap{display:flex;gap:10px;align-items:center;padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom));flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-family:inherit;font-size:13.5px;font-weight:500;
  padding:9px 16px;border-radius:4px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;transition:all .15s;white-space:nowrap}
.btn:hover{border-color:#c4c9c2}
.btn-main{background:var(--ink);border-color:var(--ink);color:#f7f7f4}
.btn-main:hover{background:var(--accent);border-color:var(--accent)}
.btn-soft{background:#f3f4f0}
.spacer{flex:1}
.msg{font-size:12.5px;min-height:20px;line-height:20px}
.msg.ok{color:var(--ok)}
.msg.err{color:var(--err)}
.preview{border:1px dashed var(--line);border-radius:4px;padding:10px;min-height:70px;background:#fafbf8;
  display:flex;align-items:center;justify-content:center;color:var(--ink3);font-size:11.5px;text-align:center}
.preview img{max-width:100%;height:auto;display:block}
.preview iframe{max-width:100%}
details.card{padding:0}
details.card summary{cursor:pointer;list-style:none;padding:clamp(14px,2.4vw,22px);font-size:13px;font-weight:600;color:var(--ink2);
  letter-spacing:.04em;display:flex;align-items:center;justify-content:space-between}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"展开";font-size:12px;font-weight:400;color:var(--ink3)}
details[open].card summary::after{content:"收起"}
details.card .inner{padding:0 clamp(14px,2.4vw,22px) clamp(14px,2.4vw,22px)}
.danger{color:var(--err)}
@media (max-width:640px){
  .grid2{grid-template-columns:1fr;gap:14px}
  .grid2 .row{margin-bottom:0}
  .actions .wrap{padding-top:10px}
  .btn{flex:1;justify-content:center}
  .spacer{display:none}
  .msg{flex-basis:100%;text-align:center}
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="brand">资源站 · <b>后台配置</b></div>
    <div class="hint">改完点「生成配置」→ 复制 → 粘贴到 config.js</div>
  </div>
</header>

<main class="wrap">

  <section class="card">
    <h2>站点</h2>
    <div class="row">
      <label for="brand">站名 <span class="opt">左上角 logo，全站同步</span></label>
      <input type="text" id="brand" placeholder="资源站">
    </div>
  </section>

  <section class="card">
    <h2>文件信息</h2>
    <div class="row">
      <label for="fname">文件名 <span class="req">*</span></label>
      <input type="text" id="fname" placeholder="微信安装包_v3.9.12.zip">
    </div>
    <div class="grid2">
      <div class="row">
        <label for="fext">类型缩写</label>
        <input type="text" id="fext" placeholder="ZIP" maxlength="6">
        <small>显示在文件卡左侧：ZIP / EXE / APK / PDF / ISO</small>
      </div>
      <div class="row">
        <label for="fsize">文件大小</label>
        <input type="text" id="fsize" placeholder="128 MB">
      </div>
      <div class="row">
        <label for="fver">版本</label>
        <input type="text" id="fver" placeholder="v1.0.0">
      </div>
      <div class="row">
        <label for="fdate">更新日期</label>
        <input type="text" id="fdate" placeholder="2026-11-09">
      </div>
    </div>
    <div class="row" style="margin-top:14px">
      <label for="fdesc">文件说明 <span class="opt">一两行最好</span></label>
      <textarea id="fdesc" placeholder="一句话说明这个文件是什么、适合谁用。"></textarea>
    </div>
  </section>

  <section class="card">
    <h2>下载</h2>
    <div class="row">
      <label for="dlurl">下载地址 <span class="req">*</span></label>
      <input type="url" id="dlurl" placeholder="https://你的网盘链接或直链">
      <small>留空则按钮显示「下载地址未配置」，点了不会跳转</small>
    </div>
    <div class="grid2">
      <div class="row">
        <label for="dltext">按钮文字</label>
        <input type="text" id="dltext" placeholder="立即下载">
      </div>
      <div class="row">
        <label for="cd">等待秒数</label>
        <input type="number" id="cd" min="0" max="60" placeholder="5">
        <small>0 = 不等待直接可点</small>
      </div>
    </div>
    <div class="row" style="margin-top:14px">
      <label for="speed">速率提示文字</label>
      <input type="text" id="speed" placeholder="120 KB/s">
    </div>
  </section>

  <section class="card">
    <h2>广告位</h2>

    <div class="row">
      <label for="adTop">顶部横幅 <span class="opt">建议 728×90</span></label>
      <textarea id="adTop" placeholder='<a href="广告链接"><img src="图片地址" alt=""></a>'></textarea>
      <div class="preview" id="pvTop">广告预览</div>
    </div>

    <div class="row">
      <label for="adSide1">左下方块 <span class="opt">建议 300×250</span></label>
      <textarea id="adSide1" placeholder='<a href="广告链接"><img src="图片地址" alt=""></a>'></textarea>
      <div class="preview" id="pvSide1">广告预览</div>
    </div>

    <div class="row">
      <label for="adSide2">右下方块 <span class="opt">建议 300×250</span></label>
      <textarea id="adSide2" placeholder='<a href="广告链接"><img src="图片地址" alt=""></a>'></textarea>
      <div class="preview" id="pvSide2">广告预览</div>
    </div>

    <div class="row">
      <label for="beacon">点击上报地址 <span class="opt">选填</span></label>
      <input type="url" id="beacon" placeholder="留空则不上报">
    </div>
  </section>

  <details class="card" id="outBox">
    <summary>生成的配置 / 导入已有配置</summary>
    <div class="inner">
      <div class="row">
        <label for="out">config.js 内容</label>
        <textarea id="out" rows="18" readonly style="min-height:300px"></textarea>
      </div>
      <div class="row">
        <label for="inp">粘贴旧的 config.js 可反向导入 <span class="opt">选填</span></label>
        <textarea id="inp" rows="6" placeholder="把现有 config.js 整段粘贴进来，点「导入」"></textarea>
      </div>
    </div>
  </details>

</main>

<div class="actions">
  <div class="wrap">
    <button class="btn btn-main" id="gen">生成配置</button>
    <button class="btn" id="copy">复制</button>
    <button class="btn btn-soft" id="download">下载 config.js</button>
    <button class="btn btn-soft" id="importBtn">导入</button>
    <button class="btn danger" id="reset">清空</button>
    <span class="spacer"></span>
    <span class="msg" id="msg"></span>
  </div>
</div>

<script>
(function () {
  'use strict';

  var KEY = 'dg_admin_form_v1';
  var ids = ['brand','fname','fext','fsize','fver','fdate','fdesc','dlurl','dltext','cd','speed','adTop','adSide1','adSide2','beacon'];
  var $ = function (id) { return document.getElementById(id); };
  var msgEl = $('msg');

  function setMsg(text, kind) {
    msgEl.textContent = text || '';
    msgEl.className = 'msg' + (kind ? ' ' + kind : '');
  }

  /* ---------- 表单 ⇄ localStorage ---------- */
  function readForm() {
    var o = {};
    ids.forEach(function (k) { o[k] = $(k).value; });
    return o;
  }

  function fillForm(o) {
    ids.forEach(function (k) {
      if (o[k] != null) $(k).value = o[k];
    });
  }

  function saveDraft() {
    try { localStorage.setItem(KEY, JSON.stringify(readForm())); } catch (e) {}
  }

  function loadDraft() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) fillForm(JSON.parse(raw));
    } catch (e) {}
  }

  ids.forEach(function (k) {
    if ($(k)) $(k).addEventListener('input', function () {
      saveDraft();
      if (k.indexOf('ad') === 0) renderPreview(k);
    });
  });

  /* ---------- 广告预览 ---------- */
  function renderPreview(key) {
    var map = { adTop: 'pvTop', adSide1: 'pvSide1', adSide2: 'pvSide2' };
    var host = $(map[key]);
    if (!host) return;
    var html = $(key).value.trim();
    if (!html) { host.textContent = '广告预览'; return; }
    host.innerHTML = '';
    var box = document.createElement('div');
    box.style.width = '100%';
    box.innerHTML = html;
    host.appendChild(box);
  }

  ['adTop','adSide1','adSide2'].forEach(renderPreview);

  /* ---------- 生成 config.js ---------- */
  function q(s) {
    return "'" + String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'") + "'";
  }

  function buildConfig() {
    var g = readForm();
    var L = [];
    L.push('/* =========================================================');
    L.push('   配置 —— 由后台面板生成');
    L.push('   生成时间：' + new Date().toLocaleString('zh-CN'));
    L.push('   ========================================================= */');
    L.push('window.SITE_CONFIG = {');
    L.push('');
    L.push('  brand: ' + q(g.brand || '资源站') + ',');
    L.push('');
    L.push('  file: {');
    L.push('    name: ' + q(g.fname || '文件名.zip') + ',');
    L.push('    ext: ' + q((g.fext || 'ZIP').toUpperCase()) + ',');
    L.push('    size: ' + q(g.fsize || '') + ',');
    L.push('    version: ' + q(g.fver || '') + ',');
    L.push('    updated: ' + q(g.fdate || '') + ',');
    L.push('    desc: ' + q(g.fdesc || ''));
    L.push('  },');
    L.push('');
    L.push('  downloadUrl: ' + q((g.dlurl || '').trim()) + ',');
    L.push('  downloadText: ' + q(g.dltext || '立即下载') + ',');
    L.push('  countdownSeconds: ' + (parseInt(g.cd, 10) >= 0 ? parseInt(g.cd, 10) : 5) + ',');
    L.push('  speedText: ' + q(g.speed || '120 KB/s') + ',');
    L.push('');
    L.push('  ads: {');
    L.push('    top: ' + q((g.adTop || '').trim()) + ',');
    L.push('    side1: ' + q((g.adSide1 || '').trim()) + ',');
    L.push('    side2: ' + q((g.adSide2 || '').trim()));
    L.push('  },');
    L.push('');
    L.push('  adClickBeacon: ' + q((g.beacon || '').trim()));
    L.push('};');
    L.push('');
    return L.join('\n');
  }

  $('gen').addEventListener('click', function () {
    var out = buildConfig();
    $('out').value = out;
    var box = $('outBox');
    if (box) box.open = true;
    $('out').scrollIntoView({ behavior: 'smooth', block: 'center' });
    setMsg('已生成，点「复制」带走', 'ok');
  });

  $('copy').addEventListener('click', function () {
    var out = $('out');
    if (!out.value.trim()) { setMsg('先点「生成配置」', 'err'); return; }
    out.select();
    out.setSelectionRange(0, 999999);
    var done = function () { setMsg('已复制到剪贴板', 'ok'); };
    var fail = function () {
      try { document.execCommand('copy'); done(); }
      catch (e) { setMsg('复制失败，请手动全选复制', 'err'); }
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(out.value).then(done, fail);
    } else { fail(); }
  });

  $('download').addEventListener('click', function () {
    var txt = $('out').value.trim() || buildConfig();
    $('out').value = txt;
    var blob = new Blob([txt], { type: 'text/javascript;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'config.js';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 3000);
    setMsg('已下载 config.js', 'ok');
  });

  /* ---------- 导入旧配置 ---------- */
  $('importBtn').addEventListener('click', function () {
    var raw = $('inp').value.trim();
    if (!raw) { setMsg('先粘贴旧配置', 'err'); return; }
    var fakeWindow = { SITE_CONFIG: null };
    try {
      var fn = new Function('window', raw);
      fn(fakeWindow);
    } catch (e) {
      setMsg('解析失败：' + e.message, 'err');
      return;
    }
    var tmp = fakeWindow.SITE_CONFIG || {};
    var f = tmp.file || {}, ads = tmp.ads || {};
    fillForm({
      brand: tmp.brand || '',
      fname: f.name || '', fext: f.ext || '', fsize: f.size || '',
      fver: f.version || '', fdate: f.updated || '', fdesc: f.desc || '',
      dlurl: tmp.downloadUrl || '', dltext: tmp.downloadText || '',
      cd: tmp.countdownSeconds != null ? tmp.countdownSeconds : '',
      speed: tmp.speedText || '',
      adTop: ads.top || '', adSide1: ads.side1 || '', adSide2: ads.side2 || '',
      beacon: tmp.adClickBeacon || ''
    });
    ['adTop','adSide1','adSide2'].forEach(renderPreview);
    saveDraft();
    setMsg('已导入，可以继续编辑', 'ok');
  });

  /* ---------- 清空 ---------- */
  $('reset').addEventListener('click', function () {
    if (!confirm('清空表单内容？本地草稿也会删除。')) return;
    ids.forEach(function (k) { $(k).value = ''; });
    ['adTop','adSide1','adSide2'].forEach(renderPreview);
    $('out').value = '';
    $('inp').value = '';
    try { localStorage.removeItem(KEY); } catch (e) {}
    setMsg('已清空', 'ok');
  });

  loadDraft();
  ['adTop','adSide1','adSide2'].forEach(renderPreview);
})();
</script>
</body>
</html>
